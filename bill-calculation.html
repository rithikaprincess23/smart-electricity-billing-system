<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bill Calculation</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="admin-layout">

<div class="sidebar">

<h2>⚡ Smart EB</h2>

<a href="/admin-dashboard">🏠 Dashboard</a>
<a href="/add-consumer">👥 Add Consumer</a>
<a href="/view-consumer">📋 View Consumer</a>
<a href="/house">🏠 House</a>
<a href="/office">🏢 Office</a>
<a href="/factory">🏭 Factory</a>
<a href="/meter-reader">👷 Meter Reader</a>
<a href="/meter-reading">📊 Meter Reading</a>
<a href="/bill-calculation">💰 Bill Calculation</a>
<a href="/payment">💳 Payment</a>
<a href="/reports">📈 Reports</a>
<a href="/">🚪 Logout</a>

</div>

<div class="dashboard-content">



<div class="bill-header">

<h1>💰 Electricity Bill Calculation</h1>

<p>
Calculate and generate electricity bills easily
</p>

</div>




<div class="form-box">


<form>


<label>Consumer Number</label>

<input type="text" id="consumer_no" onkeyup="getConsumer()" placeholder="Enter Consumer Number">


<label>Consumer Name</label>

<input type="text" id="consumer_name" readonly>


<label>Meter Number</label>

<input type="text" id="meter_no" readonly>



<label>Previous Reading</label>

<input type="number" id="previous" placeholder="Previous Unit" onkeyup="calculateBill()">



<label>Current Reading</label>

<input type="number" id="current" placeholder="Current Unit" onkeyup="calculateBill()">



<label>Units Consumed</label>
<input type="text" id="units" placeholder="Units Used" readonly>



<label>Rate Per Unit</label>

<input type="text" id="rate" value="8" readonly>



<label>Total Amount</label>

<input type="text" id="amount" placeholder="Total Bill Amount" readonly>



<button type="button" onclick="location.href='/bill-receipt'">
⚡ Generate Bill
</button>


</form>


</div>



</div>


<script>

function calculateBill(){

let previous = Number(document.getElementById("previous").value);
let current = Number(document.getElementById("current").value);

let units = current - previous;

if(units < 0){
    units = 0;
}

document.getElementById("units").value = units;

let amount = units * 8;

document.getElementById("amount").value = "₹ " + amount;

}

</script>
</body>

</html>
