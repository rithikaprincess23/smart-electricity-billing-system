<!DOCTYPE html>
<html lang="en">

<body>

<p>
Smart Electricity Bill Management Portal
</p>


</div>

<h3>Units Used</h3>

<p>350 Units</p>


</div>





<div class="consumer-card orange-card">

<h2>💳</h2>

<h3>Payment Status</h3>

</div>





<div class="consumer-card purple-card">

<h2>🧾</h2>

</div>
